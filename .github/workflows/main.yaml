name: Build Zola project and deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v6.0.1
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Build the project and upload public/ as an artifact
      uses: getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790
      with:
          zola_version: v.22.1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      url: ${{ steps.deployment.outputs.page_url }}
      name: github-pages

    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
